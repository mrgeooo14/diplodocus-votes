project_id = "diplodocus"

[api]
enabled = true
port = 54321
# Only expose the public schema via PostgREST
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Cap rows per request to prevent accidental full-table dumps
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# No buckets defined — storage is not used by this project

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
# This is a read-only public data app — no user sign-ups
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
